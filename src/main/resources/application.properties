# Server
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/upi_mesh_db
spring.datasource.username=root
spring.datasource.password=amaan8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Idempotency window (how long a packet hash is remembered)
upi.mesh.idempotency-ttl-seconds=86400

# Packet freshness window — anything older than this is rejected as replay
upi.mesh.packet-max-age-seconds=86400

#Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
idempotency.ttl-seconds=600
